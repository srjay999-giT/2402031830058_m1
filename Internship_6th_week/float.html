<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float</title>
</head>
<style>
   .box1{
    background-color: brown;
    height: 300px;
    width: 300px;
    border: 3px solid black;
   }
   .box2{
    background-color: rgb(162, 116, 116);
    height: 300px;
    width: 300px;
    border: 3px solid black;
    margin-left: auto;
   }
   .display-content{
    border: solid 2px black;
    display: flex;
    gap: 20px;
    align-items: center;
   }
   .full{
    clear: both;
    background-color: aqua;
    border: 2px solid black;
    height: 100px;
    
   }


</style>
<body>
    <div class="display-content">
        <p>Hello world this is diplay property of css</p>
        <div class="box1"></div>
        <div class="box2"></div>
    </div>

    <div class="full" >

    </div>

    <p style="clear: both;">hello world</p>

        
</body>
</html>
