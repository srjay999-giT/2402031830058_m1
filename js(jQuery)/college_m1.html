<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float properties</title>
    <style>
        #div1{
            background-color: red;
            float: left;
            width: 40%;
            font-family: 'Courier New', Courier, monospace;
            font-size: larger;
        }
        #div2{
            background-color: blue;
            float: right;
            width: 40%;
             font-family: 'Courier New', Courier, monospace;
            font-size: larger;
        }
    </style>
</head>
<body>
    <div id="div1">
        abc container
    </div>
    <div id="div2">
        xyz contianer
    </div>
</body>
</html>
