<!DOCTYPE html>
        
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table4</title>
</head>
    <style>
            table{
                border: 1px solid lightskyblue;
                text-align: center;
                background-color: lightgoldenrodyellow;
                border-collapse: collapse;
            }
            tr{
                border: 2px solid;
            }
            td{
                border: 2px solid lightskyblue;
            }
            th{
                border: 2px solid;
            }

        </style>
<body>
    <table>
        <tr>
            <td style="height: 10px; width: 20px;" colspan="4"></td>
        </tr>
        <tr >
            <td style="height: 10px; width: 20px;" rowspan="3"></td>
            <td style="height: 10px; width: 20px;" colspan="3"></td>
        </tr>
        <tr>
             <td style="height: 10px; width: 20px;" rowspan="2"></td>
             <td style="height: 10px; width: 20px;"></td>
              <td style="height: 10px; width: 20px;"></td>
        </tr>
        <tr>
            <td style="height: 10px; width: 20px;" colspan="2"></td>
        </tr>


    </table>
    
</body>
</html>
