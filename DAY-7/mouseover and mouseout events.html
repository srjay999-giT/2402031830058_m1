<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouseover Mouseout Image</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }

    .box {
      text-align: center;
    }

    img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border: 3px solid #333;
      border-radius: 10px;
      transition: 0.3s;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Hover on the image</h2>
    <img 
      id="myImage"
      src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
      alt="Nature Image"
    />
  </div>

  <script>
    let img = document.getElementById("myImage");

    img.addEventListener("mouseover", function () {
      img.src = "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80";
    });

    img.addEventListener("mouseout", function () {
      img.src = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80";
    });
  </script>

</body>
</html>
