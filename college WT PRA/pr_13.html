<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bootstrap Demo</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
<!-- Grid System -->
<h2 class="text-center mb-4">Bootstrap Grid System</h2>
<div class="row">
<div class="col-md-4 bg-primary text-white p-3">
Column 1
</div>
<div class="col-md-4 bg-success text-white p-3">
Column 2
</div>
<div class="col-md-4 bg-danger text-white p-3">
Column 3
</div>
</div>
<hr class="my-5">
<!-- Button Component -->
<h2 class="text-center mb-4">Bootstrap Buttons</h2>
<div class="text-center">
<button class="btn btn-primary">Primary Button</button>
<button class="btn btn-success">Success Button</button>
<button class="btn btn-danger">Danger Button</button>
</div>
<hr class="my-5">
<!-- Plugin: Modal & Tooltip -->
<h2 class="text-center mb-4">Bootstrap Plugins</h2>
<div class="text-center">
<!-- Modal Trigger Button -->
<button type="button" class="btn btn-warning" data-bs-toggle="modal"
data-bs-target="#exampleModal">
Open Modal
</button>
<!-- Tooltip Button -->
<button type="button" class="btn btn-info"
data-bs-toggle="tooltip"
data-bs-placement="right"
title="This is a Bootstrap Tooltip">
Hover for Tooltip
</button>
</div>
<!-- Modal Structure -->
<div class="modal fade" id="exampleModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Bootstrap Modal</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
This modal is created using Bootstrap plugin.
</div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
Close
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Enable tooltips
var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
return new bootstrap.Tooltip(tooltipTriggerEl)
})
</script>
</body>
</html>
