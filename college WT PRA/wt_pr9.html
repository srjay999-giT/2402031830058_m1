<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body {
font-family: serif;
background-color: darkcyan;
}
.container {
border: 2px solid firebrick;
width: 350px;
margin: 50px auto;
padding: 30px;
background: rgb(255, 255, 255);
border-radius: 8px;
box-shadow: 0px 0px 10px #ccc;
}
.container h2{
    color: firebrick;
}
input {
width: 100%;
padding: 8px;
margin: 8px 0;
}
.error {
color: red;
font-size: 14px;
}
.success {
color: green;
font-size: 16px;
}
button {
width: 100%;
padding: 10px;
background-color: #4CAF50;
color: white;
border: none;
cursor: pointer;
}
button:hover {
background-color: #45a049;
}
input{
    border: 2px solid firebrick;
}
</style>
</head>
<body>
<div class="container">
<h2 >Registration Form</h2>
<form id="myForm" onsubmit="return validateForm()">
<label>Name:</label>
<input type="text" id="name">
<div id="nameError" class="error"></div>
<label>Email:</label>
<input type="text" id="email">
<div id="emailError" class="error"></div>
<label>Password:</label>
<input type="password" id="password">
<div id="passwordError" class="error"></div>
<button type="submit">Submit</button>
<div id="successMessage" class="success"></div>
</form>
</div>
<script>
function validateForm() {
// Clear previous errors
document.getElementById("nameError").innerHTML = "";
document.getElementById("emailError").innerHTML = "";
document.getElementById("passwordError").innerHTML = "";
document.getElementById("successMessage").innerHTML = "";
let name = document.getElementById("name").value.trim();
let email = document.getElementById("email").value.trim();
let password = document.getElementById("password").value.trim();
let isValid = true;
// Name validation
let namePattern = /^[A-Za-z ]{3,}$/;
if (name === "") {
document.getElementById("nameError").innerHTML = "Name is required.";
isValid = false;
} else if (!namePattern.test(name)) {
document.getElementById("nameError").innerHTML = "Name must be at least 3 letters andcontain only alphabets.";
isValid = false;
}
// Email validation
let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
if (email === "") {
document.getElementById("emailError").innerHTML = "Email is required.";
isValid = false;
} else if (!emailPattern.test(email)) {
document.getElementById("emailError").innerHTML = "Enter a valid email address.";
isValid = false;
}
// Password validation
let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
if (password === "") {
document.getElementById("passwordError").innerHTML = "Password is required.";
isValid = false;
} else if (!passwordPattern.test(password)) {
document.getElementById("passwordError").innerHTML =
"Password must be at least 8 characters long and include uppercase, lowercase, and anumber.";
isValid = false;
}
if (isValid) {
document.getElementById("successMessage").innerHTML = "Form submittedsuccessfully!";
return false; // Prevent actual submission for demo
}
return false;
}
</script>
</body>
</html>
