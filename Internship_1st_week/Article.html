<body>
    <p><h1>Topic Article</h1></p>
    <p>There are three articles in English : <b>A, An, and The.</b></p><br>
    <p><b><u>Types of Article : </u></b></p>
    <p><b>A-</b> Used before words starting with a consonant sound(e.g.,a boy)</p>
    <p><b>An-</b>Used before words strating with a vowel sound(e.g., an apple)</p>
    <p><b>The-</b>Used for a specific or known noun(e.g., the sun)</p>
