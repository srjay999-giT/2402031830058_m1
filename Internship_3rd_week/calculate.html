<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>calculator</title>
    <link rel="stylesheet" href="calculate.css">

<body>

    <table>

        </tr><hr style="border-color: gray;">
        <tr>
            <td>🕒</td>
            <td>♒</td>
            <td>🗃️</td>
            <td>⌫</td>
        </tr>
        <tr>
            <td>⇆</td>
            <td>Rad</td>
            <td>✓¯</td>
            <td>|x|</td>
        </tr>
        <tr>
            <td>sin</td>
            <td>cos</td>
            <td>tan</td>
            <td>┬┬</td>
        </tr>
        <tr>
             <td>ln</td>
            <td>log</td>
            <td>1/x</td>
            <td>e</td>
        </tr>
        <tr>
            <td>e<sup>2</sup></td>
            <td>x<sup>2</sup></td>
            <td>x<sup>y</sup></td>
            
        </tr>
        <tr>
             <td style="color: red;">C</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">()</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">%</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">∻</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">X</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">-</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">+</td>
        </tr>
        <tr>
            <td>🪸</td>
            <td>0</td>
            <td>.</td>
            <td style="color: rgb(196, 196, 39); text-align: center;">=</td>
        </tr>
