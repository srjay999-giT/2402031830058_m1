<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Profile UI</title>
    <link rel="stylesheet" href="instagram.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>

<body>

<div class="profile-container">

    <div class="header">
    <div><h2 style="line-height: normal;"><u>hannahmacready.</u></h2> </div>
    <div><i class="fa-solid fa-circle-exclamation"></i></div>
    <div><i class="fa-solid fa-circle-plus" style="text-align: right;"></i></div>
    <div><i class="fa-solid fa-bars"></i></div>
    </div>

    <div class="profile-info">
        <div class="profile-pic">
            <img src="aryan.jpg" alt="profile" height="90px" width="90px" border-radius: 50%;>
        </div>

        <div class="stats">
            <div><b>690</b><br>Posts</div>
            <div><b>1,356</b><br>Followers</div>
            <div><b>1,453</b><br>Following</div>
        </div>
    </div>

    <div class="bio">
        <b>Hannah Macready</b><br>
        Writer<br>
        writer / editor / journalist
    </div>

    <div class="buttons">
        <button>Edit Profile</button>
        <button>Share Profile</button>
    </div>

    <div class="highlights">

        <div class="circle"><i class="fa-solid fa-plus"></i></div>
        <div class="circle">Journalism</div>
        <div class="circle">Literary</div>
        <div class="circle">Notes</div>
        <div class="circle">notes 2</div>
    </div>

    <div class="posts">
        <div class="post"><img src="anime-landscape-person-traveling.jpg" alt="" width="120px" height="108px"></div>
        <div class="post"><img src="water_hasira.jpg" alt="" width="120px" height="108px"></div>
        <div class="post"><img src="nature-3082832_640.jpg" alt="" width="120px" height="108px"></div>
        <div class="post"><img src="train_wallpaper.jpg" alt="" width="120px" height="108px"></div>
        <div class="post"><img src="tanjiro.jpg" alt="" width="120px" height="108px"></div>
        <div class="post"><img src="lofi-train-nature-anime-manga-style-illustration-design-wallpaper-background-art-generative-ai-lofi-train-nature-anime-manga-280578377.jpg" alt="" width="120px" height="108px"></div>
    </div>

</div>
<i class="fa-brands fa-amazon" style="font-size: 50px ;"></i>

</body>
</html>
