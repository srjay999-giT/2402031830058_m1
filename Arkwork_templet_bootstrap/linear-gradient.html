<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linear gradient</title>
</head>
<body>
    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <div style="height:200px; width: 200px; border-radius: 50%; background: radial-gradient(red, yellow) ; align-content: center; text-align: center;">radial-gradient</div>

        <div style="background: conic-gradient(red, yellow, green); height:200px; width: 200px; border-radius: 50%; align-content: center; text-align: center;">conic-gradient</div>
        
        <div style="height:200px; width: 200px; border-radius: 50%; align-content: center; text-align: center; background: repeating-linear-gradient(red,yellow 10px,green 20px);">repeating-linear-gradient</div>
        
        <div style="background: repeating-radial-gradient(red, yellow 10%, green 20%); height:200px; width: 200px; border-radius: 50%; align-content: center; text-align: center;">repeating-radial-gradient</div>
         
        <div style="background: linear-gradient(red, yellow), radial-gradient(blue, green); height:200px; width: 200px; border-radius: 50%; align-content: center; text-align: center;">multiple gradient</div>
          
        <div style="height:200px; width: 200px; border-radius: 50%; align-content: center; text-align: center; background: linear-gradient(to right, red, yellow); background: linear-gradient(to left, red, yellow); background: linear-gradient(to bottom, red, yellow); background: linear-gradient(45deg, red, yellow);">Gradient direction</div>
    </div>
    <br><br><br>
    <div class="container mt-5">
   <div class="row">
      <div class="col-md-5">

         <iframe 
         src="https://www.google.com/maps/embed?pb=!1m18..."
         max-width="auto" 
         height="400"
         style="border:2px solid black;">
         </iframe>

      </div>
      <div class="col-md-7"></div>
   </div>
</div>
</body>
</html>
