<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form1</title>
</head>
<body>
    
    <h1 style="text-align: center;">
        APPLICATION FORM
    </h1><BR></BR>
    <p style="text-align: center;">Thank you for your interest in working with us.Please check below for available job opportunities taht meet your criteria and send your application by filling out the Job Application Form.</p>
    <form >
    <table>
        <p style=" text-align: center; ">
            <label for="name" >*Full Name : </label>
            <input type="text" name="name" id="name" placeholder="Enter your fullname"></p>
        <p style=" text-align: center; ">
            <label for="">*Email : </label>
            <input type="email" name="email" placeholder="Enter your Email">
        </p>
         <p style=" text-align: center; ">
            <label for="">*Age : </label>
            <input type="number" placeholder="Age">
        </p>
        <p style="text-align: center;">
            <label for="">Which option best describe your current role?</label>
            <select name="role" id="role">
                <option value="r">student</option>
                <option value="r">Employee</option>
                <option value="r">worker</option>
                <option value="r">other</option>
            </select>
        </p>
        <p style="text-align: center;">
            <label for="">*would you like to our references?</label>
            <input type="radio" name="yes" value="yes">yes 
            <input type="radio" name="yes" value="no">no
        </p>
        <p style="text-align: center;">
            <label for="">which programming language do you know? </label>
            <input type="checkbox">java <br>
            <input type="checkbox">python <br>
            <input type="checkbox">javascript <br>
            <input type="checkbox">c++ <br>
            <input type="checkbox">swift <br>
            <input type="checkbox">Ruby <br>
            <input type="checkbox">.net <br>
        </p>
        <p style="text-align: center;">
            <label for="">Any comments? : </label>
            <!-- <input type="text" name="" placeholder="Enter your comment here..."> -->
            <textarea name="" id=""></textarea>
        </p>
        <input type="submit" style="text-align: center;margin-left: 650px;">
    </form>
    </table>
</body>
</html>
