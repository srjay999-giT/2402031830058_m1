<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form2</title>
    <style>
        body{
            background-color: bisque;
        }
       .form2{
        background-color: aquamarine;
        border: 2px solid black;
        width: 450px;
        justify-items: center;
        margin: auto;
       }
        
    </style>
</head>
<body>
    <div class="form2">
    <p><h2>Employee referral form template</h2></p>
    <form action="">
        <pre><label for="">Date</label></pre>
        <input type="date" placeholder="MM/DD/YYYY">
        <br><br>
        <pre><label for="">Applicant's Name*</label></pre>
        <input type="text" name="name" placeholder="First">  <input type="text" name="name" placeholder="Last">
        <br><br>
        <pre><label for="">Applicant's phone*     </label> <label for="">Applicant email*</label></pre>
        <input type="number">  <input type="email" placeholder="john.dce@example.com">
        <br><br>
        <label for=""><b>Referred position:</b></label>
        <br><br>
        <pre><label for="">Name and Title of position*</label></pre>
        <input type="text" name="name"  size="46">
        <br><br>
        <label for=""><b>Referred by:</b></label>
        <br><br>
        <pre><label for="">Employee name*</label></pre>
        <input type="text" name="name" placeholder="First" > <input type="text" name="name" placeholder="last">
        <br><br>
        <pre><label for="">Title                  </label> <label for="">Phone</label></pre>
        <input type="text"> <input type="number">
        <br><br>
        <pre><label for="">Email*                 </label> <label for="">Department name</label></pre>
        <input type="email" placeholder="john.deo@example.com"> <input type="text">
        <br><br>
        <pre><label for="">Address</label></pre>
        <input type="text" placeholder="Address line 1"  size="46"><br>
        <input type="text" placeholder="City">
        <select name="Region" id="Region">
            <option value="reg">Indian</option>
            <option value="reg">American</option>
            <option value="reg">japenese</option>
            <option value="reg">chinese</option>
        </select>
        <select name="united states" id="united states">
            <option value="reg">Ambala</option>
            <option value="reg">Alaska</option>
            <option value="reg">hawadi</option>
            <option value="reg">idaho</option>
        </select>
        <br><br>
        <pre><label for="">Signature*</label></pre>
        <input type="signature"  size="46">
        <br><br>
        <input placeholder="print">
        <input type="submit" >
        <button>print</button>
    </form>
    </div>
</body>
</html>
