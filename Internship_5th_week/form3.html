<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form 3</title>
</head>
<body>

<h2 style="text-align: center">Employee Complaint Form</h2>

<form action="#" method="post">

    <label>Employee Name:</label><br>
    <input type="text" placeholder="First Name">
    <input type="text" placeholder="Last Name">
    <br><br>

    <label>Employee ID Number:</label><br>
    <input type="number">
    <br><br>

    <label>Department:</label><br>
    <input type="text">
    <br><br>

    <label>Position:</label><br>
    <input type="text">
    <br><br>

    <label>Date of Incident:</label><br>
    <input type="date">
    <br><br>

    <label>Nature of Complaint:</label><br>
    <input type="radio" name="complaint"> Discrimination<br>
    <input type="radio" name="complaint"> Conflict with Co-worker<br>
    <input type="radio" name="complaint"> Workplace Safety Concern<br>
    <input type="radio" name="complaint"> Harassment<br>
    <input type="radio" name="complaint"> Other
    <br><br>

    <label>Description of Incident:</label><br>
    <input type="text">
    <br><br>

    <input type="checkbox">
    I acknowledge that the information provided in this complaint form is true and accurate to the best of my knowledge.
    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
