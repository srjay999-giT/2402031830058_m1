<!-- absolute-example.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>position: absolute</title>
  <style>
    .card { position: relative; width: 300px; height: 180px; background:#c22a2a; border:1px solid #aaa; margin: 30px; padding: 10px; }
    .abs { position: absolute; top: 10px; right: 10px; background:#a6bc29; padding:8px; border:1px solid #e88; }
    .abs2 { position: absolute; bottom: 10px; left: 10px; background:#ddffdd; padding:8px; border:1px solid #8e8; }
  </style>
</head>
<body>
  <h2>position: absolute (inside a positioned ancestor)</h2>
  <div class="card">
    This is the positioned ancestor (position: relative).
    <div class="abs">Top Right (absolute)</div>
    <div class="abs2">Bottom Left (absolute)</div>
  </div>
  <img src="" alt="">

  <p>Notice these absolute boxes are positioned relative to the .card because it has position: relative.</p>
</body>

</html>
