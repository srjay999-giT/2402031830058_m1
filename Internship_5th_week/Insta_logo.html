<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta logo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
    <style>
        .box1{
            background-color: transparent;
            height: 290px;
            width: 290px;
            border: 1px solid white;
            border-radius: 65px;
            background: linear-gradient( 166deg,blue,rgb(158, 6, 153),rgb(212, 32, 95),red, orange,rgb(255, 166, 0));
            
        }
        .box2{
            background-color: white;
            height: 200px;
            width:200px;
            border: 1px solid white;
            border-radius: 55px;
            margin: auto;
            margin-top:45px;
        }
        .box3{
            background-color: transparent;
            height: 160px;
            width: 160px;
            border: 1px solid white;
            border-radius: 45px;
            background: linear-gradient( 45deg, orange,RED, #E1306C);
            margin: auto;
            margin-top:20px;
            position: relative;
        }
        .box4{
            background-color: white;
            height: 95px;
            width: 95px;
            border: 1px solid white;
            border-radius: 50%;
            margin: auto;
            margin-top:30px;
        }
        .box5{
            background-color: transparent;
            height: 65px;
            width: 65px;
            border: 1px solid white;
            border-radius: 45px;
            background: linear-gradient( 45deg,rgb(222, 23, 83));
            margin: auto;
            margin-top:15px;
        }
        .box6{
            background-color: white;
            height: 18px;
            width: 18px;
            border: 1px solid white;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            right: 15px;
        }
        
    </style>
<body>
    <div class="box1">
        <div class="box2">
            <div class="box3">
                <div class="box6"></div>
                <div class="box4">
                    <div class="box5"></div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
