<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Animated Loader Ring</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #008000; /* green background */
        }

        .circle {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-40%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="circle"></div>  <!-- Loader -->

</body>
</html>
